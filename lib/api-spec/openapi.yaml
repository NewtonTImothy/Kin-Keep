          type: number

    CategoryBreakdown:
      type: object
      required: [categoryName, total, count]
      properties:
        categoryName:
          type: string
        total:
          type: number
        count:
          type: number

    # ─── Reports ───────────────────────────────────────────────────────────
    ReportSummary:
      type: object
      required: [startDate, endDate, totalMoneyIn, totalMoneyOut, netCashFlow, transactionCount, receiptsAttached, receiptsMissing, receiptCoverage]
      properties:
        startDate:
