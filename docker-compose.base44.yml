services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kinakeep
      POSTGRES_PASSWORD: kinakeep_dev
      POSTGRES_DB: kinakeep
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kinakeep"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  install:
    image: node:22-slim
    working_dir: /app
    volumes:
      - .:/app
      - pnpm-store:/root/.local/share/pnpm/store
    command: sh -c "corepack enable && corepack prepare pnpm@9 --activate && pnpm install --no-frozen-lockfile"
    restart: "no"

  db-push:
    image: node:22-slim
    working_dir: /app
    volumes:
      - .:/app
      - pnpm-store:/root/.local/share/pnpm/store
    environment:
      - DATABASE_URL=postgresql://kinakeep:kinakeep_dev@db:5432/kinakeep
    command: sh -c "corepack enable && corepack prepare pnpm@9 --activate && pnpm --filter @workspace/db run push"
    depends_on:
      install:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: node:22-slim
    working_dir: /app
    volumes:
      - .:/app
      - pnpm-store:/root/.local/share/pnpm/store
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - DATABASE_URL=postgresql://kinakeep:kinakeep_dev@db:5432/kinakeep
      - PORT=5000
      - NODE_ENV=development
    command: sh -c "corepack enable && corepack prepare pnpm@9 --activate && pnpm --filter @workspace/api-server run dev"
    depends_on:
      db-push:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    image: node:22-slim
    working_dir: /app
    volumes:
      - .:/app
      - pnpm-store:/root/.local/share/pnpm/store
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - BASE_PATH=/
      - NODE_ENV=development
      - VITE_API_PROXY_TARGET=http://api:5000
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command: sh -c "corepack enable && corepack prepare pnpm@9 --activate && pnpm --filter @workspace/kinakeep run dev"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  pnpm-store:
